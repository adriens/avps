name: Daily Data Update

on:
  schedule:
    - cron: '0 0 * * 1-5' # Du lundi au vendredi à minuit
  workflow_dispatch: # Permet de le lancer manuellement

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebp-dev libharfbuzz-dev libfribidi-dev libxcb1-dev

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync

      - name: Run processing script
        run: |
          set -e
          uv run src/process_avps.py
          # Vérifier que des fichiers MD ont bien été générés
          MD_COUNT=$(find docs -name "*.md" -type f | wc -l)
          echo "Generated $MD_COUNT markdown files"
          if [ "$MD_COUNT" -lt 2 ]; then
            echo "ERROR: Expected at least 2 MD files (index + offers), got $MD_COUNT"
            exit 1
          fi
          
          # Cleanup: supprimer les images JPEG générées par Marker
          echo "Cleaning up generated JPEG images..."
          find docs -name "_page_*.jpeg" -delete
          find docs -name "*_Picture_*.jpeg" -delete
          find docs -maxdepth 1 -name "*.jpeg" -delete
          echo "Cleanup completed"

      - name: Build site with Zensical
        run: |
          set -e
          uv run zensical build
          # Vérifier que le site a été généré
          if [ ! -d "site" ] || [ ! -f "site/index.html" ]; then
            echo "ERROR: Zensical build failed - site/index.html missing"
            exit 1
          fi

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          rm -f mkdocs.yml
          git add docs/ zensical.toml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            TAG_DATE=$(date +'%Y-%m-%d')
            git commit -m "chore: update AVPs data ($TAG_DATE)"
            
            # Récupérer les tags distants pour vérifier l'existence
            git fetch --tags
            
            TAG_NAME="$TAG_DATE"
            if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
              COUNT=1
              while git rev-parse "$TAG_NAME.$COUNT" >/dev/null 2>&1; do
                COUNT=$((COUNT + 1))
              done
              TAG_NAME="$TAG_NAME.$COUNT"
            fi
            
            echo "Creating tag: $TAG_NAME"
            git tag "$TAG_NAME"
            # Rebase sur les changements distants avant de pousser
            git pull --rebase origin main
            git push origin main --tags
            git push origin main
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
