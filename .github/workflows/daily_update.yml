name: Daily Data Update

on:
  schedule:
    - cron: '0 0 * * *' # S'exécute tous les jours à minuit
  workflow_dispatch: # Permet de le lancer manuellement

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebp-dev libharfbuzz-dev libfribidi-dev libxcb1-dev

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync

      - name: Run processing script
        run: uv run src/process_avps.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            TAG_DATE=$(date +'%Y-%m-%d')
            git commit -m "chore: update AVPs data ($TAG_DATE)"
            
            # Gestion du tag (incrémentation si le tag existe déjà aujourd'hui)
            TAG_NAME="$TAG_DATE"
            if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
              COUNT=1
              while git rev-parse "$TAG_NAME.$COUNT" >/dev/null 2>&1; do
                COUNT=$((COUNT + 1))
              done
              TAG_NAME="$TAG_NAME.$COUNT"
            fi
            
            git tag "$TAG_NAME"
            git push origin main --tags
            git push origin main
          fi
